[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opbnb-activity"
version = "0.1.0"
description = "Offline-first, auditable opBNB activity analytics"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pyarrow>=17", "duckdb>=1.1", "matplotlib>=3.9", "pycryptodome>=3.20,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
opbnb-activity = "opbnb_activity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opbnb_activity = ["sql/*.sql", "fixtures/*.json", "fixtures/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
